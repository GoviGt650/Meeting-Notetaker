<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fireflies Auto-Admit</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #1e293b;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ea580c;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #059669;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }
    .desc {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size:18px">⚡</span>
    <span class="title">Silent Auto-Admit</span>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Active &amp; Listening</span>
  </div>
  <p class="desc">
    This extension automatically admits your Fireflies Notetaker bot into Google Meet calls the millisecond it knocks, bypassing waiting room prompts.
  </p>
</body>
</html>
